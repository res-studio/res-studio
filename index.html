<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RES Studio</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3}header{padding:16px 22px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:15px}header b{font-size:20px;color:#6cb6ff}small,.muted{color:#8b949e}main{padding:18px;max-width:1600px;margin:auto}form{display:flex;gap:9px;margin-bottom:16px}input{flex:1;min-width:0;background:#161b22;border:1px solid #30363d;color:white;padding:12px;border-radius:7px}button,a.action{background:#238636;color:white;border:0;padding:12px 16px;border-radius:7px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr) 245px;gap:12px;min-height:65vh}.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}.panel h3{font-size:13px;margin:0;padding:13px;border-bottom:1px solid #30363d}.items{max-height:68vh;overflow:auto}.item{padding:10px;border-bottom:1px solid #30363d;cursor:pointer;overflow-wrap:anywhere;font-size:12px}.item:hover,.item.selected{background:#263244}.item span{color:#8b949e}pre{margin:0;padding:16px;white-space:pre;overflow:auto;max-height:67vh;font:12px/1.5 ui-monospace,monospace}#details{padding:14px;font-size:13px;overflow-wrap:anywhere}#details p{border-bottom:1px solid #30363d;padding-bottom:10px}#status{min-height:22px;color:#8b949e;margin-bottom:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #30363d}.toolbar button{padding:6px 10px;background:#30363d;font-size:12px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.items{max-height:180px}pre{max-height:50vh}}
.binary-upload{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;margin:0 0 14px;background:#161b22;border:1px solid #30363d;border-radius:8px}.binary-upload input{flex:1 1 230px}.binary-upload button{background:#2563eb}.binary-upload .muted{font-size:12px}</style></head><body><header><b>◈ RES Studio</b><small>Reverse Engineering Site · v0.6 · sem IA</small></header><main><form id="form"><input id="url" type="url" required placeholder="https://exemplo.com" aria-label="URL"><button id="scan">Analisar automaticamente</button><label class="action" style="background:#30363d;padding:12px;cursor:pointer">Importar HAR<input id="harfile" type="file" accept=".har,.json,application/json" style="display:none"></label><button id="dynamic" type="button">Playwright</button><button id="deep" type="button">Análise profunda</button><button id="cancel" type="button" disabled>Cancelar</button></form><section class="binary-upload" aria-label="Análise de programas"><strong>RES Binary</strong><input id="binaryfile" type="file" accept=".exe,.dll,.so,.dylib,.bin,.elf,.app,application/octet-stream" aria-label="Selecionar programa"><button id="binaryscan" type="button">Analisar programa</button><span class="muted">PE · ELF · Mach-O · até 16 MB · análise estática</span></section><div id="status">Insira uma URL pública para analisar HTML, scripts e estilos carregados.</div><div class="workspace"><section class="panel"><h3>ARQUIVOS <span id="count"></span></h3><div id="files" class="items"></div></section><section class="panel"><div class="toolbar"><span id="filename" class="muted">Selecione um arquivo</span><div><button id="decompile" disabled>Webcrack</button> <button id="wakaru" disabled>Wakaru</button> <button id="synchrony" disabled>Synchrony</button> <button id="bundle" disabled>Separar bundle</button> <button id="bundlezip" disabled>ZIP módulos</button> <button id="graph" disabled>Grafo</button> <button id="toggle" disabled>Formatar JS</button> <button id="export" disabled>ZIP original</button> <button id="exportanalyzed" disabled>ZIP analisado</button> <button id="exportproject" disabled>Projeto parcial ZIP</button></div></div><pre id="code">Aguardando análise...</pre></section><section class="panel"><h3>INSPEÇÃO ESTÁTICA</h3><div id="details">Nenhum arquivo selecionado.</div></section></div></main><script>
let session=null, selected=null, source=null, formatted=false, activeJob=null;
const $=x=>document.getElementById(x);
$('binaryscan').onclick=async()=>{
 const file=$('binaryfile').files?.[0];
 if(!file){$('status').textContent='Selecione um arquivo de programa.';return;}
 if(file.size>16*1024*1024){$('status').textContent='Arquivo maior que 16 MB.';return;}
 const button=$('binaryscan');button.disabled=true;$('status').textContent='Inspecionando programa...';
 try{
  const response=await fetch('/api/binary/inspect',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});
  const data=await response.json();
  if(!response.ok)throw Error(data.detail||'Falha na análise');
  $('filename').textContent=file.name;
  $('code').textContent=JSON.stringify(data,null,2);
  $('details').replaceChildren();
  for(const [key,value] of Object.entries(data)){const p=document.createElement('p');p.textContent=key+': '+value;$('details').append(p);}
  $('status').textContent='Análise estática concluída: '+data.format+' · '+data.architecture+'. Nenhum executável foi iniciado.';
 }catch(error){$('status').textContent='Erro na análise binária: '+error.message;}
 finally{button.disabled=false;}
};

$('harfile').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(file.size>16000000){$('status').textContent='HAR excede 16 MB';return;}
 $('status').textContent='Importando HAR localmente...';
 try{
  const r=await fetch('/api/import-har',{method:'POST',headers:{'Content-Type':'application/json'},body:file});
  const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));
  await renderScanResult(data);
 }catch(err){$('status').textContent='Importação HAR: '+err.message;}
 finally{e.target.value='';}
};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
$('form').onsubmit=async e=>{e.preventDefault();await runScan('scan-auto');};
$('dynamic').onclick=()=>runScan('scan-dynamic');
$('deep').onclick=async()=>{
 const url=$('url').value;if(!url){$('status').textContent='Informe uma URL';return;}
 $('deep').disabled=true;$('cancel').disabled=false;$('status').textContent='Iniciando análise profunda...';
 try{
  const r=await fetch('/api/jobs/deep',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  const d=await r.json();if(!r.ok)throw Error(d.detail||'Erro');
  activeJob=d.token;let state;
  while(activeJob===d.token){
   const response=await fetch('/api/jobs/'+encodeURIComponent(d.token));state=await response.json();
   if(!response.ok)throw Error(state.detail||'Erro');
   $('status').textContent='Análise '+state.status+' · '+state.count+' arquivos · '+(state.bytes/1048576).toFixed(1)+' MB';
   if(!['running','queued'].includes(state.status))break;
   await new Promise(resolve=>setTimeout(resolve,1000));
  }
  if(activeJob!==d.token)return;
  const response=await fetch('/api/jobs/'+encodeURIComponent(d.token)+'/assets?limit=500');
  const data=await response.json();if(!response.ok)throw Error(data.detail||'Erro');
  session={token:d.token,job:true,files:data.assets};$('export').disabled=false;$('exportanalyzed').disabled=false;$('exportproject').disabled=false;$('graph').disabled=true;$('files').replaceChildren();
  $('count').textContent='('+state.count+')';
  for(const f of data.assets){const div=document.createElement('div');div.className='item';div.dataset.id=f.id;div.textContent=f.type.toUpperCase()+' · '+Math.round(f.size/1024)+' KB · '+f.url;div.onclick=()=>openFile(f);$('files').append(div);}
  if(data.assets.length)await openFile(data.assets[0]);
  $('status').textContent='Análise '+state.status+' · '+state.count+' arquivos. '+(state.count>500?'Primeiros 500 exibidos. ':'')+(state.errors||[]).slice(0,3).join('; ');
 }catch(err){$('status').textContent='Erro: '+err.message;}
 finally{activeJob=null;$('deep').disabled=false;$('cancel').disabled=true;}
};
$('cancel').onclick=async()=>{if(!activeJob)return;const r=await fetch('/api/jobs/'+encodeURIComponent(activeJob)+'/cancel',{method:'POST'});if(r.ok)$('status').textContent='Cancelamento solicitado; aguardando a requisição atual.';};
async function runScan(mode){$('scan').disabled=true;$('dynamic').disabled=true;$('status').textContent='Analisando recursos públicos...';$('files').replaceChildren();$('code').textContent='Carregando...';$('details').textContent='';try{let r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value})});let data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||'Erro'));await renderScanResult(data);}catch(err){$('status').textContent='Erro: '+err.message;$('code').textContent=''}finally{$('scan').disabled=false;$('dynamic').disabled=false}}
async function renderScanResult(data){$('files').replaceChildren();session=data;$('count').textContent=`(${data.files.length})`;$('status').textContent=`${data.files.length} arquivos · ${data.requests?.length||0} requisições observadas · ${data.errors?.length||0} falhas · ${data.truncated?'limite de recursos atingido':'coleta concluída'}`;$('export').disabled=false;$('exportanalyzed').disabled=true;$('exportproject').disabled=true;$('graph').disabled=false;for(const f of data.files){let div=document.createElement('div');div.className='item';div.dataset.id=f.id;div.innerHTML=`<strong>${esc(f.type.toUpperCase())}</strong> · ${Math.round(f.size/1024)} KB<br><span>${esc(f.url)}</span>`;div.onclick=()=>openFile(f);$('files').append(div)}if(data.files.length)await openFile(data.files[0]);if(data.errors?.length)$('status').title=data.errors.join('\n')}
async function openFile(f){selected=f;formatted=false;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('selected',Number(x.dataset.id)===f.id));$('filename').textContent=f.url.split('/').pop()||f.type;let r=await fetch(session.job?`/api/jobs/${session.token}/assets/${f.id}`:`/api/file/${session.token}/${f.id}`);source=await r.json();if(!r.ok){$('status').textContent=source.detail||'Erro ao carregar arquivo';return;}if(session.job)source.formatted=source.content;$('code').textContent=source.content;$('toggle').disabled=session.job||f.type!=='js';$('decompile').disabled=session.job||f.type!=='js';$('wakaru').disabled=session.job||f.type!=='js';$('synchrony').disabled=session.job||f.type!=='js';$('bundle').disabled=session.job||f.type!=='js';$('bundlezip').disabled=true;$('toggle').textContent='Formatar JS';document.querySelectorAll('.bundle-item').forEach(x=>x.remove());$('details').innerHTML=`<p><b>Tipo:</b> ${esc(f.type)}</p><p><b>Tamanho:</b> ${f.size.toLocaleString()} bytes</p>${Object.entries(f.analysis||{}).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(Array.isArray(v)?v.join(', ')||'Não identificado':v)}</p>`).join('')}<small>Contagens heurísticas; não representam código-fonte original.</small>`}
$('toggle').onclick=()=>{if(!source)return;formatted=!formatted;$('code').textContent=formatted?source.formatted:source.content;$('toggle').textContent=formatted?'Ver original':'Formatar JS'};
$('synchrony').onclick=async()=>{if(!session||!selected)return;const b=$('synchrony');b.disabled=true;$('status').textContent='Executando Synchrony...';try{const r=await fetch(`/api/decompile/${session.token}/${selected.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({engine:'synchrony'})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Falha');$('code').textContent=data.code||'';$('status').textContent='Synchrony concluído';}catch(e){$('status').textContent='Synchrony: '+e.message;}finally{b.disabled=false;}};
$('wakaru').onclick=async()=>{if(!session||!selected)return;$('wakaru').disabled=true;$('status').textContent='Executando Wakaru...';try{const r=await fetch(`/api/decompile/${session.token}/${selected.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({engine:'wakaru'})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Falha');$('code').textContent=data.code||'';$('status').textContent='Wakaru concluído';}catch(e){$('status').textContent='Wakaru: '+e.message;}finally{$('wakaru').disabled=false;}};
$('decompile').onclick=async()=>{if(!session||!selected)return;$('decompile').disabled=true;$('status').textContent='Executando Webcrack...';try{const r=await fetch(`/api/decompile/${session.token}/${selected.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({engine:'webcrack'})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Falha');$('code').textContent=data.code||'';$('status').textContent=`Webcrack concluído · ${data.modules?.length||0} módulos recuperados`;}catch(e){$('status').textContent='Webcrack: '+e.message;}finally{$('decompile').disabled=false;}};
$('bundle').onclick=async()=>{if(!session||!selected)return;const f=selected;const b=$('bundle');b.disabled=true;$('status').textContent='Separando bundle via Webcrack...';try{const r=await fetch(`/api/bundle/${session.token}/${f.id}`,{method:'POST'});const data=await r.json();if(!r.ok)throw Error(data.detail||'Falha');document.querySelectorAll('.bundle-item').forEach(x=>x.remove());for(const m of data.modules){const el=document.createElement('div');el.className='item bundle-item';el.textContent=`  ↳ ${m.name} (${Math.round(m.size/1024)} KB)`;el.onclick=async()=>{const rr=await fetch(`/api/bundle/${session.token}/${f.id}/${m.id}`);const result=await rr.json();if(!rr.ok){$('status').textContent=result.detail||'Erro';return;}$('filename').textContent='Módulo '+result.name;$('code').textContent=result.code;};$('files').append(el)}$('bundlezip').disabled=data.count===0;$('bundlezip').dataset.fid=f.id;$('status').textContent=`${data.count} módulos extraídos · ${data.note}`;}catch(e){$('status').textContent='Bundle: '+e.message;}finally{b.disabled=false;}};
$('bundlezip').onclick=()=>{if(session&&$('bundlezip').dataset.fid)location.href=`/api/bundle-export/${session.token}/${$('bundlezip').dataset.fid}`;};
$('graph').onclick=async()=>{if(!session||session.job)return;const r=await fetch(`/api/graph/${session.token}`);const d=await r.json();$('code').textContent=JSON.stringify(d,null,2);$('status').textContent=`Grafo: ${d.nodes.length} nós, ${d.edges.length} dependências identificadas`;};
$('export').onclick=()=>{if(session)location.href=session.job?'/api/jobs/'+encodeURIComponent(session.token)+'/export?mode=original':'/api/export/'+encodeURIComponent(session.token)};
$('exportanalyzed').onclick=()=>{if(session?.job)location.href='/api/jobs/'+encodeURIComponent(session.token)+'/export?mode=analyzed'};
$('exportproject').onclick=()=>{if(session?.job)location.href='/api/jobs/'+encodeURIComponent(session.token)+'/export?mode=reconstructed'};
</script></body></html>
