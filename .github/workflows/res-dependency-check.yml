name: RES dependency smoke test
on:
  push:
    branches: [main, release-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python packages
        run: |
          python -m pip install 'fastapi>=0.110,<1' 'uvicorn>=0.27,<1' 'requests>=2.31,<3' 'playwright>=1.48,<2'
          python -c 'import fastapi,uvicorn,requests,playwright; print("Python packages OK")'
      - name: Check JavaScript engines
        run: |
          mkdir -p /tmp/res-engines
          cd /tmp/res-engines
          npm init -y
          npm install --no-audit --no-fund webcrack@^2.15.0 @wakaru/cli@^1.14.0
          node -e 'import("webcrack").then(m=>console.log("Webcrack loaded:",typeof m.webcrack))'
          ls -la node_modules/.bin/
      - name: Check Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); page=b.new_page(); page.goto("data:text/html,<title>RES test</title>"); assert page.title()=="RES test"; b.close(); p.stop(); print("Chromium OK")'
