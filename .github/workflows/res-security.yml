name: RES Security Regression
on:
  push:
    branches: [main, release-hardening]
    paths:
      - '**'
      - '.github/workflows/res-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt httpx
      - name: Run SSRF and resource-limit regressions
        working-directory: .
        run: |
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_deep_scan.py' -v
          python -m unittest discover -s tests -p 'test_deep_jobs.py' -v
