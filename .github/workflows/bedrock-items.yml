name: Bedrock static item conversion
on:
  push:
    branches: [feature/bedrock-static-items]
  pull_request:
    paths:
      - 'bedrock_items.py'
      - 'bedrock_converter.py'
      - 'tests/test_bedrock_items.py'
      - '.github/workflows/bedrock-items.yml'
jobs:
  items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_bedrock_items.py' -v
