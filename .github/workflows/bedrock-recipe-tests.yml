name: Bedrock recipe port tests
on:
  push:
    branches: [feature/bedrock-recipe-port]
  pull_request:
    paths:
      - 'bedrock_recipes.py'
      - 'bedrock_converter.py'
      - 'tests/test_bedrock_recipes.py'
      - '.github/workflows/bedrock-recipe-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_bedrock*.py' -v
