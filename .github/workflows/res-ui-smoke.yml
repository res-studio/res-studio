name: RES UI Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check actual RES UI in Chromium
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          html = Path("index.html").resolve()
          assert html.is_file(), "RES interface missing"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 390, "height": 844})
              errors = []
              page.on("pageerror", lambda err: errors.append(str(err)))
              page.goto(html.as_uri(), wait_until="load")
              assert page.locator("body").inner_text().strip(), "Empty interface"
              page.screenshot(path="res-ui-mobile.png", full_page=True)
              print("Title:", page.title())
              print("Page errors:", errors)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-ui-mobile
          path: res-ui-mobile.png
          if-no-files-found: ignore
